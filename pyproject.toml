[project]
name = "cumulative-flow-chart-op"
version = "0.1.0"
description = "Periodically renders a cumulative flow diagram from an OpenProject instance and uploads it to the project description"
requires-python = ">=3.14"
dependencies = [
    "requests",
    "schedule",
    "PyYAML",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["Chart.py"]
